name: Dev workspace (Win 2022 + Tailscale RDP, software-only)

# Software-only sessions: embedded firmware build/sim + data analysis + CV/image processing + AI coding tools.
# No hardware access. Anything needing a real board -> lab PC (see README.md).

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session length in minutes (max 335)"
        required: true
        default: "335"

jobs:
  dev-workspace:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout repo into workspace
        uses: actions/checkout@v4

      - name: Configure RDP (NLA on, Tailscale-only)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          # NLA enabled
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          # Only accept RDP from the Tailscale CGNAT range
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP user (password from secret, non-admin)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) { Write-Error "Secret RDP_PASSWORD is not set"; exit 1 }
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Shared work dir (this is what gets uploaded at the end)
          New-Item -ItemType Directory -Path C:\work -Force | Out-Null
          icacls C:\work /grant "RDP:(OI)(CI)M" | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination C:\work -Recurse -Force

      - name: Enable file sharing (SMB share + RDP drive/clipboard redirection)
        run: |
          # RDP drive + clipboard redirection allowed
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdp -Name "fDisableCdm"  -Value 0 -Force
          Set-ItemProperty -Path $rdp -Name "fDisableClip" -Value 0 -Force

          # SMB share \\<tailscale-host>\work -> C:\work
          Set-Service -Name LanmanServer -StartupType Automatic
          Start-Service -Name LanmanServer
          if (Get-SmbShare -Name "work" -ErrorAction SilentlyContinue) { Remove-SmbShare -Name "work" -Force }
          New-SmbShare -Name "work" -Path "C:\work" -FullAccess "RDP" | Out-Null

          # SMB (445) only from Tailscale range
          netsh advfirewall firewall delete rule name="SMB-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="SMB-Tailscale" `
            dir=in action=allow protocol=TCP localport=445 remoteip=100.64.0.0/10

      - name: Install dev tools (embedded + data analysis + computer vision)
        run: |
          # Embedded: ARM GCC, QEMU, VS Code, PlatformIO
          choco install -y --no-progress gcc-arm-embedded qemu vscode python311
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine")
          python -m pip install --upgrade pip
          python -m pip install platformio
          # Data analysis
          python -m pip install jupyterlab pandas numpy scipy matplotlib pyserial
          # Computer vision / image processing
          # (contrib already includes the main OpenCV modules; don't install both packages)
          python -m pip install opencv-contrib-python pillow scikit-image imageio tifffile imutils albumentations
          # Renode / Wokwi: not preinstalled. Wokwi = VS Code extension; Renode = install on demand.

      - name: Install OpenCode (CLI + Desktop)
        continue-on-error: true   # a failed AI-tool download shouldn't kill the session
        run: |
          $dl = "C:\installers"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null

          # CLI via npm
          choco install -y --no-progress nodejs-lts
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine")
          npm install -g opencode-ai@latest

          # Desktop (NSIS installer)
          $ocUrl  = "https://opencode.ai/download/stable/windows-x64-nsis"
          $ocFile = "$dl\opencode-desktop-setup.exe"
          Invoke-WebRequest -Uri $ocUrl -OutFile $ocFile -UseBasicParsing
          $head = [System.IO.File]::ReadAllBytes($ocFile)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
              Write-Warning "OpenCode download is not a Windows executable; skipping install."
          } else {
              Start-Process $ocFile -ArgumentList "/S" -Wait
              Write-Host "OpenCode Desktop installed."
          }

      - name: Install Verdent
        continue-on-error: true
        run: |
          $dl = "C:\installers"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null

          $vUrl  = "https://www.verdent.ai/api/verdent-download?platform=Windows"
          $vFile = "$dl\verdent-setup.exe"
          Invoke-WebRequest -Uri $vUrl -OutFile $vFile -UseBasicParsing -MaximumRedirection 10
          $head = [System.IO.File]::ReadAllBytes($vFile)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
              Write-Warning "Verdent download is not a Windows executable; skipping install."
          } else {
              Start-Process $vFile -ArgumentList "/S" -Wait
              Write-Host "Verdent installed (sign-in required inside the RDP session)."
          }

          # Let the non-admin RDP user run the installers if a silent install didn't cover them
          icacls $dl /grant "RDP:(OI)(CI)RX" | Out-Null

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Key must be ephemeral + tagged (tag:gh-runner); node inherits the tag from the key.
          # Fixed hostname -> connect to "gh-runner" via MagicDNS instead of the changing IP.
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=$env:TS_AUTHKEY `
            --hostname=gh-runner

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1)
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP reachable
        run: |
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "RDP port 3389 unreachable"; exit 1 }
          Write-Host "RDP reachable on $env:TAILSCALE_IP"

      - name: Keep session alive
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Host    : gh-runner  (MagicDNS)"
          Write-Host "Address : $env:TAILSCALE_IP  (may change per run)"
          Write-Host "Username: RDP"
          Write-Host "Password: (secret RDP_PASSWORD)"
          Write-Host "Work dir: C:\work  (uploaded as artifact at end)"
          Write-Host "Installers: C:\installers  (OpenCode/Verdent setup files)"
          Write-Host "SMB share: \\gh-runner\work  (user RDP)"
          Write-Host "Stop early: create C:\work\STOP"
          Write-Host "==================`n"

          $minutes = [Math]::Min([int]$env:SESSION_MINUTES, 335)
          $end = (Get-Date).AddMinutes($minutes)
          while ((Get-Date) -lt $end -and -not (Test-Path C:\work\STOP)) {
              Start-Sleep -Seconds 30
          }
          Write-Host "Session ending."

      - name: Remove Tailscale node (free the hostname)
        if: always()
        run: |
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
          }

      - name: Upload work dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: C:\work
          retention-days: 7
          if-no-files-found: ignore
